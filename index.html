<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7D5BE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gestão de tarefas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gestão de tarefas: 7º ano D</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Quicksand:wght@600;700&family=Poppins:wght@500;600;700&family=Comic+Neue:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFDF7; --ink:#26243A; --soft:#6B6880; --line:#E8E4D8;
    --dom:#8A8A9A; --seg:#FF8A3D; --ter:#2EB88A; --qua:#E0479E; --qui:#8E5BE0; --sex:#2F8FE0; --fab:#26243A; --gold:#D9A21B;
    --bring:#FFF3C4; --home:#E8EFFF; --alert:#FFE1DD; --doing:#FFE9B3; --amber:#E9C46A; --imp:#E4443F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  body{user-select:none;-webkit-user-select:none}
  input,textarea{user-select:text;-webkit-user-select:text}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:600;font-size:17px;line-height:1.4}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
  h1{font-size:28px;font-weight:900;margin:0 0 6px;line-height:1.1;text-align:center}
  button{font-family:inherit;cursor:pointer}
  .prog{margin:4px 0 14px}
  .prog .row{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;color:var(--soft);margin-bottom:6px}
  .prog .row b{color:var(--ink);font-size:16px}
  .prog .bar{height:22px;border-radius:999px;background:#EEEBF5;overflow:hidden;position:relative}
  .prog .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--seg),var(--ter),var(--sex));transition:width .6s cubic-bezier(.4,0,.2,1);position:relative}
  .prog .bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45),transparent 70%);animation:shine 2.6s ease-in-out infinite}
  .prog .pct{font-weight:900;font-size:22px;color:var(--ink)}
  .prog .done .bar i{background:linear-gradient(90deg,var(--ter),var(--gold))}
  .nav{display:none}
  .nav b{color:var(--ink)}
  .nav button{border:2px solid var(--line);background:#fff;border-radius:999px;width:36px;height:36px;font-size:18px;font-weight:900;color:var(--ink)}
  .nav button:disabled{opacity:.35}
  /* filtros (fixos ao rolar) */
  .top{position:sticky;top:0;z-index:20;background:var(--paper);margin:0 -16px 22px;padding:10px 16px 6px;box-shadow:0 10px 12px -10px rgba(38,36,58,.18)}
  .top h1{margin-bottom:8px}
  .top .fam{margin-bottom:8px}
  .filters{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 6px;margin:8px -16px 2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px;margin:0}
  .chip{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;white-space:nowrap;flex:none;transition:transform .15s}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.04)}
  .chip .arw{font-size:10px;opacity:.7;margin-left:2px}
  .chip.wide{font-weight:900;position:relative;overflow:hidden}
  .chip.wide:active{transform:scale(.94)}
  .chips.opening .chip{animation:chipIn .34s cubic-bezier(.34,1.56,.5,1) both}
  .chips.opening .chip:nth-child(1){animation-delay:0s} .chips.opening .chip:nth-child(2){animation-delay:.03s}
  .chips.opening .chip:nth-child(3){animation-delay:.06s} .chips.opening .chip:nth-child(4){animation-delay:.09s}
  .chips.opening .chip:nth-child(5){animation-delay:.12s} .chips.opening .chip:nth-child(6){animation-delay:.15s}
  .chips.opening .chip:nth-child(7){animation-delay:.18s} .chips.opening .chip:nth-child(8){animation-delay:.21s}
  .chips.opening .chip:nth-child(9){animation-delay:.24s} .chips.opening .chip:nth-child(10){animation-delay:.27s}
  .chips.opening .chip:nth-child(n+11){animation-delay:.3s}
  @keyframes chipIn{from{opacity:0;transform:translateY(-10px) scale(.8)}to{opacity:1;transform:none}}
  .chips.closing .chip{animation:chipOut .18s ease-in both}
  @keyframes chipOut{to{opacity:0;transform:scale(.85)}}
  .chip.on.todo{background:var(--sex);border-color:var(--sex)}.chip.on.doing{background:#D89A00;border-color:#D89A00}.chip.on.done{background:var(--ter);border-color:var(--ter)}.chip.on.late{background:#B3261E;border-color:#B3261E}
  /* importantes */
  .imp{background:#fff;border:3px solid var(--gold);border-radius:22px;margin-bottom:18px;--c:var(--gold);overflow:hidden}
  .imp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--gold);color:#fff}
  .imp summary .n{font-size:24px;font-weight:900;line-height:1}
  .imp summary::-webkit-details-marker{display:none}
  .imp summary .cnt{margin-left:auto;background:#fff;color:var(--gold);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;white-space:nowrap}
  .imp summary .arrow{font-size:14px;opacity:.85;transition:transform .2s}
  .imp[open] summary .arrow{transform:rotate(180deg)}
  .imp .ib{padding:0 14px 12px}
  .imp .hint{color:var(--soft);font-size:14px;margin:4px 0 2px}
  .imp .task{background:#FFF8E6;border-radius:16px;margin-top:8px;border-top:0;--tbg:#FFF8E6}
  .dchip{display:inline-block;font-size:11px;font-weight:900;color:#fff;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:2px}
  /* dias */
  .day{border:3px solid var(--c);border-radius:22px;margin-bottom:18px;overflow:hidden;background:#fff}
  .day.past{opacity:.7}
  .day.today{animation:glow 2.2s ease-in-out infinite}
  .day.today summary{position:relative;overflow:hidden}
  .day.today summary::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 0%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 28%,transparent)}}
  @keyframes shine{0%{left:-60%}40%,100%{left:120%}}
  .day summary{list-style:none;cursor:pointer;background:var(--c);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
  .day summary::-webkit-details-marker{display:none}
  .dl{display:flex;align-items:baseline;gap:8px;flex:none}
  .dl .n{font-size:24px;font-weight:900;line-height:1}
  .dl .d{opacity:.9;font-size:15px}
  .tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .tag{background:#fff;color:var(--c);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;white-space:nowrap;line-height:1.2}
  .day summary .arrow{font-size:14px;opacity:.85;flex:none;transition:transform .2s}
  .day[open] summary .arrow{transform:rotate(180deg)}
  .body{padding:12px 14px 14px}
  .aulas{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .aulas span{background:#F2F0FA;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}
  .box{border-radius:14px;padding:10px 12px;margin-top:10px}
  .boxes>.box:first-child{margin-top:0}
  .boxes{margin-top:10px}
  .bring{background:var(--bring)} .home{background:var(--home)}
  .box h3{margin:0 0 6px;font-size:16px;font-weight:900}
  .empty{color:var(--soft);font-size:14px;padding:4px 0}
  /* tarefa */
  .task{position:relative;overflow:hidden;border-radius:14px;border-top:1px dashed rgba(0,0,0,.08);touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .task:first-of-type{border-top:0}
  .sw{position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;font-weight:900;font-size:15px;color:#fff;opacity:0;transition:opacity .15s}
  .sw-r{justify-content:flex-start}
  .sw-l{justify-content:flex-end}
  .sw.st-done{background:var(--ter)} .sw.st-doing{background:var(--amber)} .sw.st-todo{background:#6B7A99}
  .task.show-r .sw-r,.task.show-l .sw-l{opacity:1}
  .tin{position:relative;display:flex;gap:10px;align-items:center;padding:9px 8px;background:var(--tbg,#fff);transition:transform .25s ease;will-change:transform}
  .task.drag .tin{transition:none}
  .task.hint .tin{animation:hintswipe 3.2s ease-in-out 1}
  .task.hint .sw-r{animation:hintr 3.2s ease-in-out 1}
  .task.hint .sw-l{animation:hintl 3.2s ease-in-out 1}
  @keyframes hintswipe{0%,8%{transform:translateX(0)}30%,40%{transform:translateX(96px)}55%,62%{transform:translateX(0)}78%,86%{transform:translateX(-96px)}100%{transform:translateX(0)}}
  @keyframes hintr{0%,8%{opacity:0}18%,48%{opacity:1}58%,100%{opacity:0}}
  @keyframes hintl{0%,62%{opacity:0}72%,94%{opacity:1}100%{opacity:0}}
  .task.pressing .tin{background:rgba(0,0,0,.04)}
  .bring .task{--tbg:var(--bring)} .home .task{--tbg:var(--home)} .imp .task{--tbg:#fff}
  .task.doing{--tbg:var(--doing)}
  @keyframes bounce{0%{transform:scale(.7)}50%{transform:scale(1.25)}75%{transform:scale(.95)}100%{transform:scale(1)}}
  @keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
  .t{flex:1;position:relative;min-width:0}
  .task.done .t{opacity:.72;transition:opacity .35s}
  .st.ok{background:#DDF3E8;color:#1E7A55}
  .st{display:inline-block;font-size:11px;font-weight:900;background:var(--amber);color:#4a3800;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
  .st.mv{background:#DCD3FF;color:#3B2A8F}
  .tg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
  .tg .st,.tg .dchip{margin:0;vertical-align:0}
  .st.sj{background:#F2F0FA;color:var(--soft)}
  .st.no{background:#FFD9D6;color:#B3261E}
  .tag.no{background:#FFD9D6;color:#B3261E}
  .box.past{opacity:.62}
  .task.late .tx{color:var(--soft)}
  .task.off{opacity:.55}
  .task.off .tx{text-decoration:line-through;color:var(--soft)}
  .task.off .note{border-left-color:#B3261E}
  .st.canc{background:#EDEAF5;color:#6B6880}
  .st.pics{background:#E9DDFF;color:#5B3FC4}
  .trea{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .trea .r{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:800;box-shadow:0 1px 3px rgba(38,36,58,.10)}
  .trea .r b{font-size:11px;color:var(--soft);font-weight:800}
  .trea .r.new{animation:pop .5s cubic-bezier(.36,1.6,.5,1)}
  .rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 12px}
  .rgrid button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--ink)}
  .rgrid button span{font-size:30px;line-height:1}
  .rgrid button.on{border-color:var(--ink);background:#F7F5FC}
  .tpics{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tpics img{width:56px;height:56px;object-fit:cover;border-radius:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(38,36,58,.18)}
  .tpics .more2{width:56px;height:56px;border-radius:12px;background:rgba(38,36,58,.12);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:var(--ink)}
  .gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
  .gal .cell{position:relative}
  .gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}
  .gal .del{position:absolute;right:4px;top:4px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:26px;height:26px;font-size:14px}
  .tx{line-height:1.35}
  .note{display:block;font-size:14px;color:var(--soft);background:#fff;border-radius:10px;padding:6px 10px;margin-top:6px;border-left:4px solid var(--c)}
  .imp .note{background:#fff}
  .quiet{color:var(--soft);font-size:15px}
  .bang{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:13px;font-weight:900;color:#fff;line-height:1;vertical-align:2px;flex:none}
  .bang.now{background:var(--ink);margin-left:8px;animation:pop .5s, bangpulse 1.8s ease-in-out .5s infinite}
  .bang.late{background:#B3261E}
  @keyframes bangpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .rem h2{font-size:22px}
  .rem .sec{margin:0 0 14px}
  .rem .sec h3{margin:0 0 6px;font-size:16px;font-weight:900}
  .rem .it{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:12px;background:#F7F5FC;margin-bottom:6px;font-size:15px;line-height:1.3}
  .rem .it.doing{background:var(--doing)}
  .rem .it .sb{flex:none;font-size:13px;font-weight:900;color:var(--soft);padding-top:1px}
  .rem .ok{text-align:center;font-size:18px;font-weight:900;padding:16px 0 6px}
  .rem .rw .task{--tbg:#F7F5FC;border-top:0;margin-bottom:6px;background:#F7F5FC}
  .rem .rw .task.doing{--tbg:var(--doing);background:var(--doing)}
  .next{background:#fff;border:3px dashed var(--line);border-radius:22px;padding:14px 16px}
  .next h2{margin:0 0 6px;font-size:19px;font-weight:900}
  /* flutuante */
  .fabs{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:12px}
  .fab{position:static;overflow:visible;isolation:isolate;width:62px;height:62px;border-radius:50%;border:0;background:var(--fab);color:#fff;font-size:28px;box-shadow:0 8px 20px rgba(38,36,58,.28);display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .fab:active{transform:scale(.92)}
  /* sheet */
  .veil{position:fixed;inset:0;background:rgba(38,36,58,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
  .veil.on{display:flex}
  body.locked{overflow:hidden;position:fixed;width:100%}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;overscroll-behavior:contain;animation:up .25s ease-out;touch-action:pan-y;will-change:transform}
  .sheet.drag{animation:none;transition:none}
  .sheet.snap{transition:transform .25s ease-out}
  .grip{width:44px;height:5px;border-radius:3px;background:#DAD6E6;margin:6px auto 12px}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .sheet h2{margin:0 0 12px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
  .sheet h2 .x{margin-left:auto;border:0;background:#F2F0FA;border-radius:50%;width:34px;height:34px;font-size:18px;font-weight:900}
  .opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#F7F5FC;border-radius:16px;padding:14px;font-size:17px;font-weight:800;color:var(--ink);margin-bottom:8px;text-align:left}
  .opt .ic{font-size:24px;width:32px;text-align:center}
  .opt.danger{color:#B3261E}
  .opt.d{color:#fff;background:var(--c)}
  .opt.imp-on{background:#FFF3D1;color:#8A6300}
  textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;min-height:100px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:10px}
  .row .opt{margin:0;justify-content:center}
  .primary{background:var(--ter)!important;color:#fff!important}
  .tt{display:grid;grid-template-columns:36px repeat(5,minmax(0,1fr));gap:5px;width:100%}
  .tt .h{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:var(--soft)}
  .tt .dh{border-radius:12px;color:#fff;font-weight:900;font-size:13px;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .tt .dh small{font-size:9px;font-weight:800;opacity:.9;margin-top:2px}
  .tt .c{border-radius:12px;background:#F5F3FB;border:2px solid transparent;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;overflow:hidden;cursor:pointer;transition:opacity .2s,transform .2s,background .2s}
  .tt .c:active{transform:scale(.94)}
  .tt .c b{font-size:20px;line-height:1}
  .tt .c span{font-size:9.5px;font-weight:800;color:var(--ink);line-height:1.05;text-align:center;overflow-wrap:anywhere}
  .tt .c.past,.tt .dh.past{opacity:.38}
  .tt .c.tom{background:color-mix(in srgb,var(--dc) 14%,#fff);border-color:var(--dc)}
  .tt .c.tom span{color:var(--dc)}
  .tt.pick .c{opacity:.28}
  .tt.pick .c.hit{opacity:1;background:var(--ink);border-color:var(--ink);transform:scale(1.04)}
  .tt.pick .c.hit span{color:#fff}
  .ttnote{color:var(--soft);font-size:13px;margin:14px 0 0;text-align:center}
  .wk{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;font-size:16px;font-weight:800;color:var(--ink);text-align:left}
  .wk.cur{border-color:var(--ter);background:#EEF9F4}
  .wk .pr{margin-left:auto;font-size:13px;color:var(--soft);text-align:right}
  .wk .bar{height:6px;background:#EEE;border-radius:3px;overflow:hidden;width:70px;display:block}
  .wk .bar i{display:block;height:100%;background:var(--ter)}
  .spark{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:99;animation:fly .8s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .users{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .uopt{border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:16px;color:var(--ink)}
  .uopt .av{font-size:38px;line-height:1}
  .uopt small{font-weight:700;color:var(--soft);font-size:11px}
  .uopt:active{transform:scale(.95);border-color:var(--ink)}
  .who{text-align:center;margin:-2px 0 10px}
  .who span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:800}
  .who small{color:var(--soft);font-weight:700}
  /* família / presença */
  .fam{display:flex;justify-content:center;gap:22px;margin:2px 0 12px}
  .fam .p{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--soft);border:0;background:none;padding:0}
  .fam .p .avw{position:relative}
  .fam .p .av{width:64px;height:64px;border-radius:50%;background:#F2F0FA;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid var(--line);overflow:hidden}
  .fam .p .av img{width:100%;height:100%;object-fit:cover}
  .fam .p .dot{position:absolute;right:0;bottom:0;width:17px;height:17px;border-radius:50%;background:#B9B6C6;border:2px solid #fff;z-index:1}
  .fam .p.on .dot{background:#2EB88A;box-shadow:0 0 0 3px rgba(46,184,138,.25)}
  .fam .p.on{color:var(--ink)}
  .fam .p.me .av{border-color:var(--ink)}
  .fam .p:not(.on) .av{filter:grayscale(.6);opacity:.75}
  .uopt .av{width:56px;height:56px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#F2F0FA}
  .uopt .av img{width:100%;height:100%;object-fit:cover}
  /* conversa */
  .chatfab{background:var(--sex)}
  .reafab{background:#E9A227;display:none}
  .reafab.on{display:flex}
  .reafab.pulse{animation:reap 1.6s ease-in-out infinite}

function resumoDia(w,d){
  const ts=allTasks(w).filter(t=>t.day===d.k);

  const bloco=(titulo,lista)=>{ if(!lista.length) return; L.push(''); L.push(titulo);
    lista.forEach(t=>{ const ic=t.off?'🚫':(t.status==='done'?'✅':(t.status==='doing'?'⏳':(taskPassed(t)?'❗':'⬜')));
      L.push(`${ic} ${SUBJ[t.subj]||''} · ${plain(t.text)}`);
      if(t.off&&t.offWhy) L.push(`     🚫 Cancelada: ${t.offWhy}`);
      if(t.note) L.push(`     📝 ${t.note}`); }); };
  bloco('🎒 LEVAR PARA A ESCOLA', ts.filter(t=>t.type===B));
  bloco(d.k==='sex'?'🏠 FAZER NO FIM DE SEMANA':'🏠 FAZER EM CASA PARA AMANHÃ', ts.filter(t=>t.type===H));

  L.push(''); L.push(`📊 ${feitas} de ${live.length} concluídas${live.length&&feitas===live.length?' 🎉 Tudo feito!':''}`);
  const falta=live.filter(t=>t.status!=='done').length; if(falta) L.push(`⬜ Ainda falta: ${falta}`);

  return L.join('\n');
}

function openCropper(file,opt){ // opt: {circle, out, aspects}
  return new Promise((resolve)=>{
    const url=URL.createObjectURL(file); let img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); build(); };
    img.onerror=()=>{toast('Não consegui abrir a imagem');resolve(null);};
    img.src=url;
    let nw,nh,s0,sc,ox,oy,W,H,asp=opt.circle?1:(opt.aspects?opt.aspects[0][1]:1),fi=0;
    function build(){
      nw=img.naturalWidth; nh=img.naturalHeight;
      show(`<h2>✂️ Enquadrar foto <button class="x">✕</button></h2><div class="crop">
        <div class="cropbox" id="cropbox"><img id="cropimg" alt=""><div class="cropmask ${opt.circle?'circle':''}" id="cropmask"></div></div>
        <div class="cropbar"><span>🔍</span><input type="range" id="cropzoom" min="0" max="100" value="0"><button class="opt" id="cropRot" style="width:auto;margin:0;padding:8px 12px">🔄</button></div>
        ${opt.aspects?`<div class="cropasp">${opt.aspects.map(([n,a],i)=>`<button data-i="${i}" class="${i===fi?'on':''}">${n}</button>`).join('')}</div>`:''}
        <p class="quiet" style="margin:0;font-size:13px;text-align:center">Arrasta para mover, pinça ou usa a barra para aproximar.</p>
        <div class="row" style="width:100%;max-width:340px"><button class="opt" id="cropCancel">Cancelar</button><button class="opt primary" id="cropOk">Usar</button></div></div>`);
      const box=document.getElementById('cropbox'), el=document.getElementById('cropimg'), mask=document.getElementById('cropmask'), zoom=document.getElementById('cropzoom');
      el.src=img.src;
      function layout(){ const bw=box.clientWidth; W=bw; H=Math.round(bw/asp); if(H>360){H=360;W=Math.round(H*asp);} box.style.height=H+'px'; mask.style.left=((bw-W)/2)+'px'; mask.style.width=W+'px'; mask.style.top='0'; mask.style.height=H+'px';
        s0=Math.max(W/nw,H/nh); sc=s0; ox=(bw-W)/2+(W-nw*sc)/2; oy=(H-nh*sc)/2; zoom.value=0; draw(); }
      function clamp(){ const bw=box.clientWidth, L=(bw-W)/2; ox=Math.min(L,Math.max(L+W-nw*sc,ox)); oy=Math.min(0,Math.max(H-nh*sc,oy)); }
      function draw(){ clamp(); el.style.transform=`translate(${ox}px,${oy}px) scale(${sc})`; }
      function setScale(ns,cx,cy){ const k=ns/sc; ox=cx-(cx-ox)*k; oy=cy-(cy-oy)*k; sc=ns; draw(); }
      zoom.addEventListener('input',()=>{ const ns=s0*(1+zoom.value/100*3); const bw=box.clientWidth; setScale(ns,bw/2,H/2); });
      let pts={}, last=null;
      box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY};last=null;});
      box.addEventListener('pointermove',e=>{ if(!pts[e.pointerId]) return; const r=box.getBoundingClientRect(); const cur={x:e.clientX,y:e.clientY}; const ids=Object.keys(pts);
        if(ids.length===1){ ox+=cur.x-pts[e.pointerId].x; oy+=cur.y-pts[e.pointerId].y; pts[e.pointerId]=cur; draw(); }
        else if(ids.length>=2){ const other=pts[ids.find(i=>i!=e.pointerId)]; const prev=pts[e.pointerId]; const d0=Math.hypot(other.x-prev.x,other.y-prev.y), d1=Math.hypot(other.x-cur.x,other.y-cur.y);
          const cx=(other.x+cur.x)/2-r.left, cy=(other.y+cur.y)/2-r.top; if(d0>0){ setScale(Math.max(s0,Math.min(s0*4,sc*d1/d0)),cx,cy); zoom.value=Math.round((sc/s0-1)/3*100); } pts[e.pointerId]=cur; } });
      const up=e=>{delete pts[e.pointerId];}; box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
      box.addEventListener('wheel',e=>{e.preventDefault(); const r=box.getBoundingClientRect(); setScale(Math.max(s0,Math.min(s0*4,sc*(e.deltaY<0?1.1:0.9))),e.clientX-r.left,e.clientY-r.top); zoom.value=Math.round((sc/s0-1)/3*100);},{passive:false});
      document.getElementById('cropRot').addEventListener('click',()=>{ const c=document.createElement('canvas'); c.width=nh; c.height=nw; const x=c.getContext('2d'); x.translate(nh,0); x.rotate(Math.PI/2); x.drawImage(img,0,0); const n=new Image(); n.onload=()=>{img=n; el.src=n.src; nw=n.naturalWidth; nh=n.naturalHeight; layout();}; n.src=c.toDataURL('image/jpeg',.92); });
      sheet.querySelectorAll('.cropasp button').forEach(b=>b.addEventListener('click',()=>{fi=+b.dataset.i; asp=opt.aspects[fi][1]; sheet.querySelectorAll('.cropasp button').forEach(x=>x.classList.toggle('on',x===b)); layout();}));
      const cancel=()=>{hide();resolve(null);};
      document.getElementById('cropCancel').addEventListener('click',cancel); sheet.querySelector('.x').addEventListener('click',cancel,{once:true});
      document.getElementById('cropOk').addEventListener('click',()=>{ const bw=box.clientWidth, L=(bw-W)/2; const sx=(L-ox)/sc, sy=(0-oy)/sc, sw=W/sc, sh=H/sc;
        const outW=Math.min(opt.out||1280,Math.round(sw)), outH=Math.round(outW*sh/sw); const c=document.createElement('canvas'); c.width=outW; c.height=outH; c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,outW,outH);
        hide(); resolve(c.toDataURL('image/jpeg',opt.q||.85)); });
      layout(); window.addEventListener('resize',layout,{once:true});
    }
  });
}

function dayLabel(d){ if(d===TODAY) return 'Hoje'; if(d===addDays(TODAY,-1)) return 'Ontem';
  const dt=new Date(d+'T12:00:00'); const dias=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const diff=(new Date(TODAY+'T12:00:00')-dt)/86400000; return (diff<7? dias[dt.getDay()]+', ':'')+fmt(d); }
function msgHtml(m,i,arr){
  const u=USERS.find(x=>x.id===m.by)||{emoji:'👤',nome:m.by,id:m.by,cor:'#8A8A9A'}; const me=USER&&m.by===USER.id;
  const prev=arr[i-1]; const cont=prev&&prev.by===m.by&&(m.t||0)-(prev.t||0)<5*60*1000&&!m.reply;

  const others=USERS.filter(x=>x.id!==m.by); const seenAll=others.every(x=>(READS[x.id]||0)>=(m.t||0)); const seenAny=others.some(x=>(READS[x.id]||0)>=(m.t||0));

  const hm=String(new Date(m.t||0).getHours()).padStart(2,'0')+':'+String(new Date(m.t||0).getMinutes()).padStart(2,'0');
  return `<div class="msg ${me?'me':''} ${cont?'cont':''}" data-k="${m.k}" style="--uc:${(me&&THEME==='lilas')?'#8E5BE0':(u.cor||'#8A8A9A')}"><span class="av">${avatarHtml(u)}</span><div><div class="b ${onlyEmo?'emo':''}"><b>${esc(u.nome)}</b>${q}${att}${chatQ.length>=2?hl(m.text||'',chatQ):esc(m.text||'')}<small>${hm}${m.edited?'<i class="ed">(editada)</i>':''}${tick}</small></div>${reactsHtml(m)}</div></div>`;
}
function chatHtml(){
  if(chatQ.length>=2){ const ql=chatQ.toLowerCase();
    const hits=CHAT.filter(m=>(m.text||'').toLowerCase().includes(ql)||(m.att&&(m.att.name||'').toLowerCase().includes(ql)));
    if(!hits.length) return '<div class="empty">Nenhuma mensagem com<br><b>“'+esc(chatQ)+'”</b></div>';
    return hits.map((m,i,arr)=>`<div class="daysep">${dayLabel(iso(new Date(m.t||0)))}</div>`+msgHtml(m,i,arr)).join('');
  }
  if(!CHAT.length) return '<div class="empty">Ainda não tem mensagens.<br>Manda um oi! 👋</div>';
  const groups=[]; CHAT.forEach(m=>{ const d=iso(new Date(m.t||0)); const g=groups[groups.length-1]; if(g&&g.d===d) g.msgs.push(m); else groups.push({d,msgs:[m]}); });
  return groups.map(g=>{ const inner=g.msgs.map((m,i,arr)=>msgHtml(m,i,arr)).join('');
    if(g.d===TODAY) return `<div class="daysep">Hoje</div>${inner}`;
    const open=chatOpenDays[g.d]?' open':'';
    return `<details class="daygrp" data-day="${g.d}"${open}><summary>${dayLabel(g.d)} · ${g.msgs.length} mensagem${g.msgs.length>1?'s':''}<span class="arw">▼</span></summary><div class="inner">${inner}</div></details>`; }).join('');
}
function bindMsgs(){

  box.querySelectorAll('.q:not(.qt)').forEach(q=>q.addEventListener('click',e=>{e.stopPropagation(); const t=box.querySelector(`.msg[data-k="${q.dataset.go}"]`); if(t){t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),1300);} }));
  box.querySelectorAll('.msg').forEach(el=>{
    let timer=null,sx=0,sy=0;
    const start=(x,y)=>{sx=x;sy=y;el.classList.add('pressing');timer=setTimeout(()=>{el.classList.remove('pressing');vibrate(30);openMsgMenu(el.dataset.k);},450);};
    const cancel=()=>{clearTimeout(timer);el.classList.remove('pressing');};
    el.addEventListener('touchstart',e=>start(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
    el.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10)cancel();},{passive:true});
    el.addEventListener('touchend',cancel); el.addEventListener('touchcancel',cancel);
    el.addEventListener('mousedown',e=>{if(e.button===0)start(e.clientX,e.clientY);}); el.addEventListener('mouseup',cancel); el.addEventListener('mouseleave',cancel);
  });
}

function sendAttachment(f){
  if(!famRef||!USER||!f) return;
  const MAX=3*1024*1024; if(!f.type.startsWith('image/')&&f.size>MAX){toast('Arquivo muito grande (máximo 3 MB)');return;}
  const txt0=document.getElementById('chatTxt'); const caption=txt0?txt0.value.trim():''; if(!f.type.startsWith('image/')) toast('Enviando…');
  const finish=(att,data,mime)=>{ const ref=famRef.child('chat').push(); const msg={by:USER.id,text:caption,t:firebase.database.ServerValue.TIMESTAMP,att}; if(replyTo) msg.reply=replyTo;
    famRef.child('anexos/'+ref.key).set({data,name:f.name,mime}).then(()=>ref.set(msg)).then(()=>{ const txt=document.getElementById('chatTxt'); if(txt) txt.value=''; replyTo=null; const eb=document.getElementById('editbar'); if(eb) eb.classList.remove('on'); vibrate(15); toast('Enviado ✅'); }).catch(()=>toast('Não consegui enviar')); };
  if(f.type.startsWith('image/')){
    const tmp=new Image(); const u=URL.createObjectURL(f);
    tmp.onload=()=>{ URL.revokeObjectURL(u); const orig=tmp.width/tmp.height;
      openCropper(f,{out:1280,q:.82,aspects:[['Original',orig],['Quadrado',1],['4:3',4/3],['3:4',3/4],['16:9',16/9]]}).then(full=>{ if(!full){ openChat(); return; }
        const im=new Image(); im.onload=()=>{ const k=Math.min(1,360/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          openChat(); toast('Enviando…'); finish({kind:'img',thumb:c.toDataURL('image/jpeg',.72),name:f.name,size:f.size},full,'image/jpeg'); }; im.src=full; }); };
    tmp.onerror=()=>toast('Não consegui ler a imagem'); tmp.src=u;
  } else { const r=new FileReader(); r.onload=()=>finish({kind:'file',name:f.name,size:f.size},r.result,f.type||'application/octet-stream'); r.readAsDataURL(f); }
}

const fmt=d=>{const [y,m,dd]=d.split('-');return dd+'/'+m;};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function allTasks(w){return w.days.flatMap(d=>d.tasks).filter(t=>!t.skip);}
function liveTasks(w){return allTasks(w).filter(t=>!t.off);}
function pass(t){ const st = fType==='late' ? (t.status!=='done'&&taskPassed(t)) : (fType==='all' || (t.status===fType && !(t.status==='todo'&&taskPassed(t)))); return st && (fSubj==='all' || t.subj===fSubj); }
const addDays=(dIso,n)=>{const d=new Date(dIso+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
function boxPassed(w,d,type){
  if(type===B) return d.date<TODAY || (d.date===TODAY && NOW_H>=12.5);       // depois da aula, "levar" já passou
  const i=w.days.indexOf(d); const nx=w.days[i+1]?w.days[i+1].date:addDays(d.date,3); // "para amanhã" vence quando começa a aula do dia seguinte
  return nx<TODAY || (nx===TODAY && NOW_H>=7.3);
}
function taskPassed(t){const w=DB.weeks[current];const d=w.days.find(x=>x.k===t.day);return d?boxPassed(w,d,t.type):false;}
function findTask(id){for(const w of Object.values(DB.weeks)){const t=allTasks(w).find(t=>t.id===id);if(t)return t;}}

        <span class="arrow">▼</span></summary>
      <div class="body">
        <div class="aulas">${d.feriado?`<span>🎉 Feriado: ${d.feriado}</span>`:((TIMETABLE.days[d.k]||[]).map(k=>`<span>${SUBJ[k]}</span>`).join('')||'<span>😴 Sem aula</span>')}</div>
        ${boxes||'<div class="empty">Nada aqui com esse filtro.</div>'}

  });
  html+='</div>';
  if(w.topics&&!filtering) html+=`<div class="next"><h2>📌 O que cada matéria está estudando</h2><p class="quiet" style="margin:0">${w.topics}</p></div>`;
  document.getElementById('app').innerHTML=html;
  if(typeof appBadge==='function') appBadge();
  if(typeof updateReaFab==='function') updateReaFab();
  document.querySelectorAll('.day,.imp').forEach(el=>el.addEventListener('toggle',()=>openState[el.dataset.date]=el.open));
  bindTasks();
}
function taskHtml(t,inImp){
  const moved = t.day!==t.origin ? `<span class="st mv">Mudou de dia</span>` : '';
  const dchip = inImp ? `<span class="dchip" style="background:${dayCss(t.day)}">${DAYMETA[t.day][0]}</span>` : '';
  const subj = `<span class="st sj">${SUBJ[t.subj]}</span>`;
  const late=!t.off&&t.status!=='done'&&taskPassed(t);
  const status=((t.pics||0)?`<span class="st pics">📸 ${t.pics}</span>`:'')+(t.off?`<span class="st canc">🚫 Cancelada</span>`:'')+(late?'<span class="bang late" title="Esquecido">!</span><span class="st no">❌ Esquecido</span>':'')+(t.status==='doing'?'<span class="st">⏳ Fazendo</span>':'')+(t.status==='done'?'<span class="st ok">✓ Feito</span>':'')+moved;
  return `<div class="task ${t.status} ${late?'late':''} ${t.off?'off':''}" data-id="${t.id}">
    <div class="sw sw-r st-${(NEXT_R[t.status]||'done')}">${SWLBL[NEXT_R[t.status]||'done'][0]}</div>
    <div class="sw sw-l st-${(NEXT_L[t.status]||'doing')}">${SWLBL[NEXT_L[t.status]||'doing'][0]}</div>
    <div class="tin">
      <div class="t"><div class="tg">${dchip}${subj}${status}</div><div class="tx">${t.text}</div>
        ${(t.reacts&&Object.keys(t.reacts).length)?`<div class="trea">${Object.values(t.reacts).map(r=>`<span class="r">${r.e} <b>${esc(r.n||'')}</b></span>`).join('')}</div>`:''}${(t.pics||0)&&t.thumbs?`<div class="tpics" data-pics="${t.id}">${t.thumbs.slice(0,4).map(u=>`<img src="${u}" alt="">`).join('')}${t.pics>4?`<span class="more2">+${t.pics-4}</span>`:''}</div>`:''}${t.off?`<span class="note">🚫 <b>${esc(t.offBy||'')}:</b> ${esc(t.offWhy||'')}</span>`:''}${t.note?`<span class="note">📝 ${t.noteBy&&(!USER||t.noteBy!==USER.nome)?'<b>'+esc(t.noteBy)+':</b> ':''}${esc(t.note)}</span>`:''}</div>
    </div>
  </div>`;
}

const SOUND=true;
let AC=null;
function tone(seq){ if(!SOUND) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
  let t=AC.currentTime+0.01;
  seq.forEach(([f,d,v,type])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v||0.18,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02); t+=d*0.85; });
}catch(e){} }
const SFX={
  done:()=>tone([[660,.10],[880,.10],[1175,.20]]),        // concluiu: subindo
  doing:()=>tone([[520,.09],[700,.12]]),                   // fazendo
  undo:()=>tone([[520,.10],[380,.14]]),                    // reabriu: descendo
  party:()=>tone([[784,.10],[988,.10],[1175,.10],[1568,.28]]), // dia inteiro feito
  msg:()=>tone([[1046,.07,.14],[1318,.12,.14]]),           // mensagem nova
  send:()=>tone([[880,.06,.10]]),
  pop:()=>tone([[660,.05,.10]]),
  err:()=>tone([[300,.12,.16,'square'],[220,.16,.14,'square']])
};
function vibrate(p){if(navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}
function sparks(x,y,color){for(let i=0;i<10;i++){const e=document.createElement('i');e.className='spark';e.style.left=x+'px';e.style.top=y+'px';e.style.background=color;
  const a=Math.random()*Math.PI*2,r=40+Math.random()*50;e.style.setProperty('--dx',Math.cos(a)*r+'px');e.style.setProperty('--dy',Math.sin(a)*r+'px');
  document.body.appendChild(e);setTimeout(()=>e.remove(),800);}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800);}
function colorOf(el){return getComputedStyle(el).getPropertyValue('--c').trim()||'#2EB88A';}

function setStatus(id,status,el){
  const t=findTask(id); const w=DB.weeks[current];
  const dayEl=document.querySelector(`.day[data-date="${w.days.find(d=>d.k===t.day).date}"]`);
  const wasComplete=dayEl&&dayEl.classList.contains('complete');
  t.status=status; t.u=Date.now(); save();
  if(status==='done'){vibrate([30,30,60]);SFX.done();const r=el.querySelector('.tin').getBoundingClientRect();sparks(r.left+24,r.top+r.height/2,colorOf(el.closest('.day')||el.closest('.imp')||el.closest('.rw')||el));}
  if(status==='doing'){vibrate(25);SFX.doing();}
  const dayLive=allTasks(w).filter(x=>x.day===t.day&&!x.off); const complete=dayLive.length>0&&dayLive.every(x=>x.status==='done');
  render(); refreshReminder();
  if(status==='done'&&!t.off) setTimeout(()=>askPhotoAfterDone(id),600);
  if(complete&&!wasComplete){vibrate([60,40,60,40,120]);SFX.party();const c=colorOf(document.querySelector(`.day[data-date="${dayEl.dataset.date}"]`));
    for(let k=0;k<6;k++)setTimeout(()=>sparks(window.innerWidth*Math.random(),120+Math.random()*200,c),k*90);}

// Para a direita: falta → fazendo → concluída → reabrir (falta) → ...  Para a esquerda: o caminho inverso.
const NEXT_R={todo:'doing',doing:'done',done:'todo'}, NEXT_L={todo:'done',done:'doing',doing:'todo'};
const SWLBL={doing:['⏳ Fazendo','doing'],done:['✓ Concluir','done'],todo:['↩ Reabrir','todo']};
const SWMSG={doing:'⏳ Marcada como fazendo',done:'✅ Concluída! Mandou bem',todo:'↩ Reaberta. Ficou como falta fazer'};
function swipeAction(id,dir,el){
  if(!isAluna()){ el.querySelector('.tin').style.transform=''; el.classList.remove('show-r','show-l'); vibrate(20); toast('Só a Maria marca as tarefas 😉'); return; }
  const t=findTask(id);
  if(t.off){ el.querySelector('.tin').style.transform=''; el.classList.remove('show-r','show-l'); vibrate(20); toast('Essa tarefa está cancelada. Segura nela para voltar a valer'); return; }
  const status = dir>0 ? NEXT_R[t.status]||'done' : NEXT_L[t.status]||'doing';
  setStatus(id,status,el); toast(SWMSG[status]);
}
function bindTasks(root=document.getElementById('app')){
  root.querySelectorAll('[data-pics]').forEach(g=>g.addEventListener('click',e=>{e.stopPropagation();openPics(g.dataset.pics);}));
  root.querySelectorAll('.task').forEach(el=>{
    const id=el.dataset.id, tin=el.querySelector('.tin');
    let timer=null, sx=0, sy=0, dx=0, mode=null; // mode: null | 'h' | 'v'
    const cancelPress=()=>{clearTimeout(timer);el.classList.remove('pressing');};
    el.addEventListener('touchstart',ev=>{const t=ev.touches[0];sx=t.clientX;sy=t.clientY;dx=0;mode=null;
      el.classList.add('pressing');timer=setTimeout(()=>{if(mode===null){vibrate(30);el.classList.remove('pressing');openMenu(id);mode='v';}},520);},{passive:true});
    el.addEventListener('touchmove',ev=>{const t=ev.touches[0];const x=t.clientX-sx,y=t.clientY-sy;
      if(mode===null){ if(Math.abs(x)>10&&Math.abs(x)>Math.abs(y)*1.4){mode='h';cancelPress();el.classList.add('drag');} else if(Math.abs(y)>10){mode='v';cancelPress();} else return; }
      if(mode!=='h') return;
      ev.preventDefault(); dx=Math.max(-130,Math.min(130,x));
      tin.style.transform='translateX('+dx+'px)';
      el.classList.toggle('show-r',dx>8); el.classList.toggle('show-l',dx<-8);
      if(Math.abs(dx)>=70&&!el._armed){el._armed=true;vibrate(15);} if(Math.abs(dx)<70) el._armed=false;
    },{passive:false});
    const end=()=>{cancelPress(); if(mode!=='h'){return;} el.classList.remove('drag');
      if(Math.abs(dx)>=70){tin.style.transform='translateX('+(dx>0?'110%':'-110%')+')';setTimeout(()=>swipeAction(id,dx,el),120);}
      else{tin.style.transform='';el.classList.remove('show-r','show-l');}
      mode=null;};
    el.addEventListener('touchend',end); el.addEventListener('touchcancel',end);
    // desktop: segurar com o mouse abre o menu; arrastar com o mouse também funciona
    el.addEventListener('mousedown',ev=>{if(ev.button!==0)return;sx=ev.clientX;dx=0;mode=null;el.classList.add('pressing');
      timer=setTimeout(()=>{if(mode===null){el.classList.remove('pressing');openMenu(id);mode='v';}},520);
      const mv=e=>{const x=e.clientX-sx;if(mode===null&&Math.abs(x)>10){mode='h';cancelPress();el.classList.add('drag');}if(mode!=='h')return;dx=Math.max(-130,Math.min(130,x));tin.style.transform='translateX('+dx+'px)';el.classList.toggle('show-r',dx>8);el.classList.toggle('show-l',dx<-8);};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);end();};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
    el.addEventListener('contextmenu',e=>e.preventDefault());
  });
}

sheet.addEventListener('touchstart',e=>{armed=sheet.scrollTop<=0 && !e.target.closest('.nodrag');dragging=false;dy=0;ty=e.touches[0].clientY;tx=e.touches[0].clientX;t0=Date.now();},{passive:true});
sheet.addEventListener('touchmove',e=>{if(!armed)return;const y=e.touches[0].clientY-ty,x=e.touches[0].clientX-tx;
  if(!dragging){ if(y>14&&Math.abs(y)>Math.abs(x)*1.5){dragging=true;sheet.classList.add('drag');sheet.classList.remove('snap');} else if(y<-6||Math.abs(x)>14){armed=false;} return; }
  dy=Math.max(0,y);e.preventDefault();sheet.style.transform='translateY('+dy+'px)';},{passive:false});
const endDrag=()=>{if(!dragging){armed=false;return;}dragging=false;armed=false;sheet.classList.remove('drag');sheet.classList.add('snap');
  const fast=dy/(Date.now()-t0)>0.5; if(dy>110||(fast&&dy>50)){sheet.style.transform='translateY(110%)';setTimeout(hide,220);} else sheet.style.transform='';};
sheet.addEventListener('touchend',endDrag); sheet.addEventListener('touchcancel',endDrag);

function allReacts(){ const out=[];
  Object.keys(DB.weeks).forEach(id=>{ const w=DB.weeks[id];
    allTasks(w).forEach(t=>{ if(!t.reacts) return; Object.keys(t.reacts).forEach(uid=>{ const r=t.reacts[uid]; out.push({...r,uid,task:t,week:id}); }); }); });
  return out.sort((a,b)=>(b.t||0)-(a.t||0));
}
function reaNew(){ return allReacts().filter(r=>(r.t||0)>reaSeen).length; }

function countPics(id){ if(!picsRef(id)) return; picsRef(id).once('value').then(sn=>{ const v=sn.val()||{}; const ks=Object.keys(v).sort();
  const t=findTask(id); if(!t) return; t.pics=ks.length; t.thumbs=ks.slice(-4).map(k=>v[k].thumb||v[k].data); t.u=Date.now(); save(); render(); }); }
document.getElementById('taskFoto').addEventListener('change',ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(!f||!picTaskId) return;
  openCropper(f,{out:1280,q:.8,aspects:[['Original',4/3],['Quadrado',1],['3:4',3/4]]}).then(full=>{ if(!full){ openPics(picTaskId); return; }
    const im=new Image(); im.onload=()=>{ const k=Math.min(1,260/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const id=picTaskId; toast('Enviando foto…');
      picsRef(id).push({data:full,thumb:c.toDataURL('image/jpeg',.7),by:USER?USER.id:'',t:Date.now()}).then(()=>{ countPics(id); SFX.pop(); vibrate(20); toast('Foto guardada 📸'); openPics(id); }).catch(()=>toast('Não consegui enviar'));

function openTimetable(){
  const dow=new Date().getDay();
  const keys=['dom','seg','ter','qua','qui','sex','sab'];
  const todayK=keys[dow], tomK=keys[(dow+1)%7];
  const ks=['seg','ter','qua','qui','sex'];
  const SHORT={cie:'Ciências',por:'Português',mat:'Matemát.',rel:'Religião',edf:'Ed. Física',ing:'Inglês',pdv:'Proj. Vida',geo:'Geografia',his:'História',esp:'Espanhol',art:'Arte',fil:'Filosofia'};
  const col=k=>getComputedStyle(document.documentElement).getPropertyValue(DAYMETA[k][1]).trim();
  const idx=k=>keys.indexOf(k);
  const mark=k=>k===tomK?'tom':(idx(k)<=idx(todayK)?'past':'');
  let g=`<div class="h"></div>`+ks.map(k=>`<div class="dh ${mark(k)}" style="background:${dayCss(k)}">${DAYMETA[k][0].slice(0,3)}${k===tomK?'<small>amanhã</small>':k===todayK?'<small>hoje</small>':''}</div>`).join('');
  TIMETABLE.hours.forEach((h,i)=>{g+=`<div class="h">${h}</div>`+ks.map(k=>{const sk=TIMETABLE.days[k][i];const em=SUBJ[sk].split(' ')[0];
    return `<div class="c ${mark(k)}" data-sk="${sk}" style="--dc:${col(k)}"><b>${em}</b><span>${SHORT[sk]}</span></div>`;}).join('');});
  show(`<h2>📅 Aulas do ${TIMETABLE.turma} <button class="x">✕</button></h2><div class="tt" id="tt">${g}</div><p class="ttnote" id="ttnote">Toca em uma matéria para ver todos os dias dela.</p>`);
  let picked=null;
  const tt=document.getElementById('tt'), note=document.getElementById('ttnote');
  tt.querySelectorAll('.c').forEach(c=>c.addEventListener('click',()=>{
    const sk=c.dataset.sk; picked = picked===sk ? null : sk; vibrate(15);
    tt.classList.toggle('pick',!!picked);
    tt.querySelectorAll('.c').forEach(x=>x.classList.toggle('hit',!!picked&&x.dataset.sk===picked));
    note.textContent = picked ? SUBJ[picked]+': '+tt.querySelectorAll('.c.hit').length+' aulas na semana. Toca de novo para voltar.' : 'Toca em uma matéria para ver todos os dias dela.';
  }));
}

function reminderHtml(){
  const w=DB.weeks[current]; const idx=w.days.findIndex(d=>d.date===TODAY);
  const nextIdx=idx<0 ? w.days.findIndex(d=>d.date>TODAY) : idx;
  if(nextIdx<0) return null;
  const pend=t=>t.status!=='done'&&!t.off;
  const greet=NOW_H<12?'Bom dia':NOW_H<18?'Boa tarde':'Boa noite';
  const secs=[];
  if(idx<0){ const d=w.days[nextIdx];
    secs.push(['🏠 O que fazer até '+DAYMETA[d.k][0].toLowerCase(), allTasks(w).filter(t=>t.day===d.k&&t.type===H&&pend(t))]);
  } else if(MORNING){ const d=w.days[idx];
    secs.push(['🎒 O que levar hoje', allTasks(w).filter(t=>t.day===d.k&&t.type===B&&pend(t))]);
  } else { const d=w.days[idx], n=w.days[idx+1];
    secs.push([n?'🏠 O que fazer para amanhã ('+DAYMETA[n.k][0].toLowerCase()+')':'🏠 O que fazer no fim de semana', allTasks(w).filter(t=>t.day===d.k&&t.type===H&&pend(t))]);
  }
  const doing=allTasks(w).filter(t=>t.status==='doing'&&!t.off&&!secs[0][1].includes(t));
  if(doing.length) secs.push(['⏳ O que você está fazendo', doing]);
  const total=secs.reduce((a,[,l])=>a+l.length,0);
  const nome=USER?', '+USER.nome:''; const dica=isAluna()?'Arrasta para a direita quando terminar. Arrasta para a esquerda se ainda está fazendo.':'Você está acompanhando as tarefas da Maria. Segura em uma tarefa para deixar uma observação.';
  return `<div class="rem"><h2>${greet}${nome}! 👋 <button class="x">✕</button></h2>
    ${total?secs.filter(([,l])=>l.length).map(([h,l])=>`<div class="sec"><h3>${h}</h3>${l.map(t=>`<div class="rw" style="--c:${dayCss(t.day)}">${taskHtml(t,true)}</div>`).join('')}</div>`).join(''):'<div class="ok">Tudo em dia! 🎉<br><small class="quiet">Não tem nada para fazer agora.</small></div>'}
    <p class="quiet" style="margin:4px 0 10px;font-size:13px;text-align:center">${dica}</p>
    <button class="opt primary" id="remGo" style="justify-content:center">Vamos lá! 💪</button></div>`;
}

document.addEventListener('pointerdown',()=>{ if(SOUND&&!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); },{once:false,passive:true});
document.addEventListener('contextmenu',e=>{ if(!e.target.closest('input,textarea')) e.preventDefault(); });

/* ================= LEMBRETES (notificações locais) =================
   Funciona enquanto o app estiver aberto ou em segundo plano recente.
   A cada hora, das 13h às 21h, avisa a Maria do que falta para amanhã. */
const NOTIF_H1=13, NOTIF_H2=21;
let notifTimer=null;
function pendingTomorrow(){ const w=DB.weeks[current]; if(!w) return []; const idx=w.days.findIndex(d=>d.date===TODAY); if(idx<0) return [];
  const d=w.days[idx]; return allTasks(w).filter(t=>t.day===d.k&&t.type===H&&t.status!=='done'&&!t.off); }
async function askNotif(){ if(!('Notification' in window)) return false; if(Notification.permission==='granted') return true; if(Notification.permission==='denied') return false;
  try{ const r=await Notification.requestPermission(); return r==='granted'; }catch(e){ return false; } }
async function notify(title,body){ if(!('Notification' in window)||Notification.permission!=='granted') return;
  try{ const reg=await navigator.serviceWorker?.getRegistration(); if(reg) return reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'lembrete',renotify:true,vibrate:[80,40,80]}); new Notification(title,{body,icon:'icon-192.png'}); }catch(e){}
}
async function notifyMsg(m){ if(!('Notification' in window)||Notification.permission!=='granted') return;
  try{ const reg=await navigator.serviceWorker?.getRegistration(); const opt={body:msgPreview(m),icon:'icon-192.png',badge:'icon-192.png',tag:'chat-'+m.k,vibrate:[60,40,60]};
    if(reg) return reg.showNotification('💬 '+uname(m.by),opt); new Notification('💬 '+uname(m.by),opt); }catch(e){} }
function hourlyReminder(){ if(!USER||USER.papel!=='aluna') return; const h=new Date().getHours(); if(h<NOTIF_H1||h>NOTIF_H2) return;
  const key=KEY+'-notif-'+TODAY+'-'+h; try{ if(localStorage.getItem(key)) return; localStorage.setItem(key,'1'); }catch(e){}
  const p=pendingTomorrow(); if(!p.length) return;
  const first=p[0].text.replace(/<[^>]+>/g,''); notify('🎒 Ainda falta '+p.length+' tarefa'+(p.length>1?'s':'')+' para amanhã', first+(p.length>1?' e mais '+(p.length-1):'')); }
function startReminders(){ clearInterval(notifTimer); askNotif(); if(!USER||USER.papel!=='aluna') return; askNotif().then(ok=>{ if(!ok) return; hourlyReminder(); notifTimer=setInterval(hourlyReminder,60*1000); }); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) hourlyReminder(); });
render();
// ao abrir, rola até o dia de hoje (uma vez por abertura)
setTimeout(()=>{ const el=document.querySelector('.day.today'); if(!el) return;
  const top=el.getBoundingClientRect().top+window.scrollY-(document.querySelector('.top')?.offsetHeight||0)-10;
  window.scrollTo({top:Math.max(0,top),behavior:'smooth'}); },500);
let remSeen=false; try{remSeen=localStorage.getItem(KEY+'-rem')===TODAY;}catch(e){}   // lembrete: uma vez por dia
if(CLOUD_CFG && !USER){ setTimeout(()=>openLogin(remSeen?null:openReminder),350); }
else { cloudStart(); startReminders(); if(!remSeen) setTimeout(openReminder,350); }
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
